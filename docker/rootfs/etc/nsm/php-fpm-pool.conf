[nsm]
user = nsm
group = nsm

; Unix soketi: nginx ile aynı konteynerde, TCP'ye gerek yok.
listen = /run/php/nsm.sock
listen.owner = nsm
listen.group = nsm
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Uzun süren NETCONF isteği yok (hepsi kuyrukta) ama ölçüm okumaları var.
request_terminate_timeout = 120s

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
