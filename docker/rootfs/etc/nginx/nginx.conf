# Panelin kendi nginx'i. Konteyner DÜZ HTTP dinler; TLS önündeki ters vekilde
# sonlanır.
user  nsm;
worker_processes  auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    client_max_body_size 32m;

    # ---------------------------------------------------------------------
    #  HTTP_HOST'un PORTU
    # ---------------------------------------------------------------------
    #  Debian'ın fastcgi_params dosyası HTTP_HOST'u "$host" ile geçiriyor —
    #  bilinçli bir güvenlik önlemi: ham "$http_host" istemcinin gönderdiği
    #  Host başlığını olduğu gibi taşır ve mutlak biçimli istek satırıyla
    #  çelişebilir. Ama "$host" PORTU DÜŞÜRÜR.
    #
    #  Sonuç: standart olmayan bir portta çalışan panel, giriş sonrası
    #  "http://192.0.2.50/login" adresine yönlendirir — port kaybolduğu
    #  için sayfa hiç açılmaz.
    #
    #  nginx 1.30 bunun için "$is_request_port$request_port" değişkenlerini
    #  getirdi; imajdaki 1.22'de yoklar. Aynı şeyi elle kuruyoruz: konak
    #  nginx'in NORMALLEŞTİRDİĞİ "$host"tan, port ise Host başlığından
    #  yalnızca RAKAM olarak alınır. Ham konak adı asla geçmez.
    map $http_host $istek_portu {
        default                 "";
        "~^[^:]+:(?<p>[0-9]+)$" ":$p";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
