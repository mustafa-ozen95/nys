# Proxy yolu normalleştirmeyle değişebiliyorsa (nokta parçası, kodlanmış
# karakter, ters/çift eğik çizgi) 1 olur. "if" içinde regex KULLANILMAZ: if'in
# regex'i adlandırılmış yakalamaları ($ttyd_port) ezer; map bu yan etkiyi taşımaz.
map $request_uri $proxy_yolu_bozuk {
    default 0;
    "~*^[^?]*(%|\\\\|//|/\.\.?(/|$))" 1;
}

# Yalnız 80 (düz HTTP). TLS'i önündeki vekil bitirir: platformun kendisi
# (NineDeploy/Traefik, Coolify...) ya da Caddy/nginx. Panel isteğin HTTPS
# olduğunu vekilin X-Forwarded-Proto başlığından bilir (bootstrap/app.php →
# trustProxies). ttyd (7700-7900) ve Tomcat (8090) yalnız 127.0.0.1'de;
# onlara buradaki /ssh-proxy/ ve /rdp-proxy/ üzerinden gelinir.
server {
    listen 80 default_server;

    # NOT: "http2 on;" YAZILMAZ. O sözdizimi nginx 1.25.1 ile geldi; imajdaki
    # Debian bookworm nginx 1.22 taşıyor ve "unknown directive http2" ile
    # başlamayı reddediyor. Panel için HTTP/2 zaten şart değil.

    server_name _;

    root /uygulama/public;
    index index.php;

    charset utf-8;

    # --- SSH WebSocket vekili -------------------------------------------------
    # ttyd'nin KENDİ kimlik doğrulaması yoktur. Bu kontrol olmadan, açık bir
    # oturum sırasında port aralığını tarayan kimliksiz biri terminale
    # düşebilir. Laravel her istekte oturum sahibini ve bağlanma yetkisini
    # yeniden sorar.
    #
    # Aralık "if" ile DEĞİL konum deseninde sınırlanır: if bloğu adlandırılmış
    # yakalamayı alt isteğe taşımıyor.
    #
    # Desen config/remote.php → ttyd.port_range ile BİREBİR eşleşmek zorundadır.
    #
    # YETKİ İLE SUNUM AYNI YOLU GÖRMELİ: konum çözülmüş/normalleştirilmiş $uri'ye
    # göre seçilir, bekçiye ise HAM $request_uri gider. "/ssh-proxy/7701/../7700/"
    # bekçide 7701 (kendi portun), burada 7700 (başkasının portu) olurdu.
    # Bu yüzden yolunda nokta parçası, kodlanmış nokta/eğik çizgi, ters eğik
    # çizgi ya da çift eğik çizgi olan istek hiç işlenmez (bekçi de aynısını
    # reddeder; iki kural birlikte değişmeli). Aralık config/remote.php ile
    # aynı: 7700-7900.
    location ~ ^/ssh-proxy/(?<ttyd_port>7(?:[78][0-9][0-9]|900))(?<path>/.*)?$ {
        if ($proxy_yolu_bozuk) {
            return 403;
        }

        auth_request /remote-session-guard;

        proxy_pass http://127.0.0.1:$ttyd_port$path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ~ ^/ssh-proxy/ {
        return 403;
    }

    # --- RDP vekili (Guacamole) ----------------------------------------------
    # Guacamole'un kendi jetonu var; bu kontrol panel oturumunu da şart koşar.
    location ^~ /rdp-proxy/ {
        if ($proxy_yolu_bozuk) {
            return 403;
        }

        auth_request /remote-session-guard;

        proxy_pass http://127.0.0.1:8090/guacamole/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Statik varlıklar ve çerezler doğru dizinden çalışsın.
        proxy_cookie_path /guacamole/ /rdp-proxy/;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- Uzak oturum bekçisi --------------------------------------------------
    # Yalnızca nginx'in kendi alt isteğiyle çağrılır.
    #
    # fastcgi_params burada BİLEREK include edilmez: içindeki REQUEST_URI
    # istemcinin özgün adresini taşır, alt isteğininkini değil. Include
    # edilirse Laravel /ssh-proxy/7701/ adresini arayıp 404 döner ve nginx
    # bunu 500'e çevirir.
    location = /remote-session-guard {
        internal;

        fastcgi_pass unix:/run/php/nsm.sock;

        fastcgi_param GATEWAY_INTERFACE  CGI/1.1;
        fastcgi_param SERVER_SOFTWARE    nginx;
        fastcgi_param SERVER_PROTOCOL    $server_protocol;
        fastcgi_param SERVER_NAME        $server_name;
        fastcgi_param SERVER_ADDR        $server_addr;
        fastcgi_param SERVER_PORT        443;
        fastcgi_param REMOTE_ADDR        $remote_addr;
        fastcgi_param REMOTE_PORT        $remote_port;
        fastcgi_param REQUEST_METHOD     GET;
        fastcgi_param CONTENT_TYPE       "";
        fastcgi_param CONTENT_LENGTH     "";
        fastcgi_param DOCUMENT_ROOT      $document_root;
        fastcgi_param SCRIPT_FILENAME    $document_root/index.php;
        fastcgi_param SCRIPT_NAME        /index.php;
        fastcgi_param DOCUMENT_URI       /ajax/remote-session/verify;
        fastcgi_param REQUEST_URI        /ajax/remote-session/verify;
        fastcgi_param QUERY_STRING       "";

        # Hangi portun sorulduğunu bekçi bu başlıktan okur; alt istekte
        # değişken taşımak güvenilir değil.
        fastcgi_param HTTP_X_ORIGINAL_URI $request_uri;
        fastcgi_param HTTPS              on;
        # Aynı sebeple ham $http_host değil; bkz. nginx.conf'taki map.
        fastcgi_param HTTP_HOST          $host$istek_portu;
    }

    # --- Panel ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/nsm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # Portu geri kazandırır; gerekçe nginx.conf'taki map'te.
        fastcgi_param HTTP_HOST $host$istek_portu;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # index.php dışında hiçbir PHP dosyası doğrudan çalıştırılmaz.
    location ~ \.php$ {
        return 404;
    }

    location ~* \.(css|js|mjs|map|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|otf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
