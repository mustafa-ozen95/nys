; Konteynerin süreç yöneticisi. PID 1 budur.
;
; Veritabanı ve Redis bu konteynerde DEĞİL (docker-compose.yml: db, redis).
; Koşullu tek parça Guacamole (guacd + Tomcat): GUACAMOLE_SECRET verilmişse
; nsm-entrypoint conf.d altına onun dosyasını bırakır.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf

; --- Web ---------------------------------------------------------------------
[program:php-fpm]
command = /usr/sbin/php-fpm%(ENV_PHP_VERSION)s --nodaemonize --fpm-config /etc/php/%(ENV_PHP_VERSION)s/fpm/php-fpm.conf
priority = 20
autorestart = true
startsecs = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
priority = 25
autorestart = true
startsecs = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; --- Kuyruklar ---------------------------------------------------------------
; Cihaza yazma işçisi. Ayarlar iş sınıfının kendi ayarlarıyla AYNI olmak
; zorunda: --tries=1 çünkü cihaz yazması kör tekrar edilmez, yarıda kalmış bir
; değişikliğe ikinci kez yazmak panelin bilmediği bir duruma yazmaktır.
; --timeout=300 çünkü tek yazma iki gerçek commit içerir ve ELS switchte tek
; commit on saniyeyi aşabilir.
[program:isci-yazma]
command = /usr/bin/php artisan queue:work redis --queue=nms-switch-write --tries=1 --timeout=300 --max-time=3600 --sleep=1
directory = /uygulama
user = nsm
priority = 30
autorestart = true
stopwaitsecs = 310
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

;  "default" kuyruğu için emniyet ağı.
;
; Hiçbir iş oraya yazmaz: her iş kuyruğunu açıkça seçer ve
; KuyrukKapsamiTest bunu kilitler. Yine de dinlenir — kuyruğunu seçmeyi
; unutan bir iş sessizce beklemede kalmasın. Anons mailleri nms-switch-sync'e
; gider ve onu zamanlayıcının açtığı işçiler alır.
[program:isci-genel]
command = /usr/bin/php artisan queue:work redis --queue=default --tries=3 --timeout=120 --max-time=3600 --sleep=1
directory = /uygulama
user = nsm
priority = 30
autorestart = true
stopwaitsecs = 130
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; --- Yeniden başlatma ----------------------------------------------------------
; Panel veritabanını taşımak için konteynerin yeniden başlamasını ister; panel
; kullanıcısı bu sokete erişemediği için isteği root olarak bu döngü yerine
; getirir (bkz. dc-yeniden-baslat).
[program:yeniden-baslat]
command = /usr/local/bin/dc-yeniden-baslat
priority = 40
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; --- Zamanlayıcı -------------------------------------------------------------
; cron yerine schedule:work. Eşitleme işçilerini bu açar (routes/console.php).
[program:zamanlayici]
command = /usr/bin/php artisan schedule:work
directory = /uygulama
user = nsm
priority = 31
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
